services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ideas
      POSTGRES_PASSWORD: ideas
      POSTGRES_DB: ideas
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ideas -d ideas"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./apps/backend
    environment:
      DATABASE_URL: postgresql://ideas:ideas@postgres:5432/ideas
      FORCE_READINESS_FAIL: "0"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./apps/frontend
    environment:
      API_BASE_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata:
