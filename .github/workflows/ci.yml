name: CI/CD

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run API tests
        run: pytest -q

  build-scan-push:
    needs: backend-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.meta.outputs.backend }}
      frontend_image: ${{ steps.meta.outputs.frontend }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "backend=ghcr.io/${OWNER}/idea-board-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${OWNER}/idea-board-frontend" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build backend (local load for scan)
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          load: true
          tags: |
            ${{ steps.meta.outputs.backend }}:latest
            ${{ steps.meta.outputs.backend }}:${{ steps.meta.outputs.sha }}

      - name: Build frontend (local load for scan)
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          load: true
          tags: |
            ${{ steps.meta.outputs.frontend }}:latest
            ${{ steps.meta.outputs.frontend }}:${{ steps.meta.outputs.sha }}

      # Trivy is Apache-2.0 / free for OSS. Fail the job on CRITICAL findings.
      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.backend }}:${{ steps.meta.outputs.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.frontend }}:${{ steps.meta.outputs.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Push backend
        run: |
          docker push ${{ steps.meta.outputs.backend }}:latest
          docker push ${{ steps.meta.outputs.backend }}:${{ steps.meta.outputs.sha }}

      - name: Push frontend
        run: |
          docker push ${{ steps.meta.outputs.frontend }}:latest
          docker push ${{ steps.meta.outputs.frontend }}:${{ steps.meta.outputs.sha }}

  deploy-gcp:
    needs: build-scan-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      NAMESPACE: idea-board-demo
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GKE
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: idea-board-demo-gke
          location: asia-south1-a
          project_id: idea-board-platform

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Roll out new images
        env:
          BACKEND: ${{ needs.build-scan-push.outputs.backend_image }}:${{ needs.build-scan-push.outputs.sha }}
          FRONTEND: ${{ needs.build-scan-push.outputs.frontend_image }}:${{ needs.build-scan-push.outputs.sha }}
        run: |
          set -euo pipefail
          kubectl set env deployment/backend -n "$NAMESPACE" FORCE_READINESS_FAIL=0
          kubectl set image deployment/backend -n "$NAMESPACE" "backend=${BACKEND}"
          kubectl set image deployment/frontend -n "$NAMESPACE" "frontend=${FRONTEND}"
          kubectl rollout status deployment/backend -n "$NAMESPACE" --timeout=180s
          kubectl rollout status deployment/frontend -n "$NAMESPACE" --timeout=180s

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post-deploy Health Sentinel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/health_sentinel.py \
            --namespace "$NAMESPACE" \
            --deployment backend \
            --wait-seconds 90 \
            --max-restarts 3 \
            --undo
